[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/pty",
    "crates/render",
    "crates/gui",
]
default-members = ["crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Project Terminal Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
term-core = { path = "crates/core" }
term-pty = { path = "crates/pty" }
term-render = { path = "crates/render" }

# Harici bağımlılıklar
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "ioctl", "poll"] }
vte = "0.14"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "2.0"
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "24.0"
glyphon = "0.8"
cosmic-text = "0.12"
arboard = "3.4"
pollster = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
toml = "0.8"
