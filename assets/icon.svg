<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2030" />
      <stop offset="50%" stop-color="#161622" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#3d59a1" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shadow / Glow -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="#7aa2f7" opacity="0.12" filter="url(#glow)" />

  <!-- Window Container -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Titlebar Separator -->
  <line x1="28" y1="120" x2="484" y2="120" stroke="#24283b" stroke-width="3" />

  <!-- Window Controls -->
  <circle cx="86" cy="74" r="14" fill="#f7768e" />
  <circle cx="132" cy="74" r="14" fill="#e0af68" />
  <circle cx="178" cy="74" r="14" fill="#9ece6a" />

  <!-- Titlebar Mini Tab Indicator -->
  <rect x="230" y="58" width="120" height="32" rx="8" fill="#1f2335" />
  <text x="290" y="79" font-family="monospace, sans-serif" font-size="16" font-weight="bold" fill="#7aa2f7" text-anchor="middle" dominant-baseline="central">term</text>

  <!-- Terminal Prompt Chevron (>) with Glow -->
  <path d="M 110 200 L 220 286 L 110 372" fill="none" stroke="url(#promptGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Terminal Cursor Block (_) with Glow -->
  <rect x="260" y="340" width="128" height="32" rx="8" fill="url(#cursorGrad)" filter="url(#subtleGlow)" />

  <!-- Subtle Accent Sparkles / Indicators -->
  <circle cx="410" cy="210" r="4" fill="#7dcfff" opacity="0.7" />
  <circle cx="430" cy="240" r="3" fill="#bb9af7" opacity="0.5" />
  <circle cx="390" cy="260" r="2" fill="#7aa2f7" opacity="0.6" />
</svg>
